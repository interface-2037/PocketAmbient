name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"     # nightly: full 8-hour matrix

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: pip install numpy scipy soundfile pyloudnorm matplotlib
      - name: Tables are up to date
        run: python tools/gen_tables.py && git diff --exit-code
      - name: Build + unit tests
        run: make test
      - name: Firmware (RV32IMC) on the instruction-set simulator == host render
        run: |
          sudo apt-get install -y lld llvm
          make build/render build/rvsim
          make fw PYTHON=python
          tools/check_fw.sh 10 build/fw/composer.bin
          tools/check_fw.sh 10
      - name: Long unit tests (nightly)
        if: github.event_name == 'schedule'
        run: ./build/tests --long
      - name: Render + analyze (10 min per mode / corner / seed)
        if: github.event_name != 'schedule'
        run: EXE= tools/run_validation.sh quick 4
      - name: Full render matrix (nightly)
        if: github.event_name == 'schedule'
        run: EXE= tools/run_validation.sh full 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
  rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get install -y verilator iverilog
      - name: Settings bridge unit test
        run: |
          iverilog -g2012 -o tb_settings.vvp sim/tb/tb_settings.sv src/fpga/core/settings_bridge.sv
          vvp -n tb_settings.vvp | tee tb_settings.log
          grep -q "^PASS" tb_settings.log
      - name: Full system (CPU + firmware + engine) == host render, 2 s per mode, with menu changes
        run: make build/render && SET=0.5:MODE=tides,1:RESEED=1,1.5:DENSITY=5 FAST=1 sim/run_sys.sh 2
  # Quartus builds need a self-hosted runner (see README).
